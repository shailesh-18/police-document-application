<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Preview - Police Case Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background: #f5f5f5;
            color: #333;
            padding: 0;
        }

        .container {
            max-width: none;
            margin: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            min-height: 100vh;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.8;
            font-size: 14px;
        }

        .controls {
            background: #34495e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn-secondary {
            background: #7f8c8d;
        }

        .btn-secondary:hover {
            background: #636e72;
        }

        .btn-disabled {
            background: #bdc3c7 !important;
            cursor: not-allowed !important;
            opacity: 0.6;
        }

        .btn-disabled:hover {
            background: #bdc3c7 !important;
        }

        .edit-count-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }

        .preview-container {
            padding: 20px;
            background: #f8f9fa;
            min-height: 600px;
            overflow-x: auto;
        }

        .document-preview {
            background: white;
            border: 1px solid #ddd;
            padding: 30px;
            font-family: 'Noto Sans Gujarati', 'Segoe UI', sans-serif;
            line-height: 1.8;
            min-height: 800px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .document-preview table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }

        .document-preview td {
            border: 1px solid #000;
            padding: 8px;
            vertical-align: top;
        }

        .variable {
            background-color: #fff3cd;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px dashed #ffc107;
            font-weight: bold;
            cursor: text;
            transition: background-color 0.2s;
        }

        .variable:hover {
            background-color: #ffe69c;
        }

        .variable:focus {
            outline: 2px solid #ffc107;
            background-color: #fff;
        }

        .page-break {
            page-break-before: always;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px dashed #ddd;
        }

        .page-number {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #ecf0f1;
            color: #7f8c8d;
            font-size: 14px;
        }

        .floating-edit-btn {
            position: fixed;
            z-index: 10000;
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .floating-edit-btn:hover {
            background: #229954;
        }

        .edit-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 10001;
            justify-content: center;
            align-items: center;
        }

        .edit-modal-overlay.show {
            display: flex;
        }

        .edit-modal {
            background: white;
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 10002;
        }

        .edit-modal h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .edit-modal textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .edit-modal textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .edit-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .edit-modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }

        .edit-modal-btn.save {
            background: #27ae60;
            color: white;
        }

        .edit-modal-btn.save:hover {
            background: #229954;
        }

        .edit-modal-btn.cancel {
            background: #95a5a6;
            color: white;
        }

        .edit-modal-btn.cancel:hover {
            background: #7f8c8d;
        }

        @media print {
            @page {
                margin: 0;
            }

            body {
                background: white;
                margin: 0;
                padding: 0;
            }

            .header,
            .controls,
            .footer {
                display: none;
            }

            .preview-container {
                padding: 0;
            }

            .document-preview {
                box-shadow: none;
                border: none;
            }

            .page-number {
                display: none;
            }

            .page-break {
                margin-top: 0;
                padding-top: 0;
                border-top: none;
            }

            .variable {
                background: none;
                border: none;
                padding: 0;
            }
        }
    </style>

        const DATE_FIELDS = [

        // Function to format date from YYYY-MM-DD to DD-MM-YYYY
        function formatDateDDMMYYYY(dateStr) {
            if (!dateStr || typeof dateStr !== 'string') return dateStr;

            // Check if it's in YYYY-MM-DD format
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const parts = dateStr.split('-');
                return `${parts[2]}-${parts[1]}-${parts[0]}`; // DD-MM-YYYY
            }

            return dateStr;
        }

        // Function to get variable value from localStorage
    function getVariableValue(key) {
            const caseData = JSON.parse(localStorage.getItem('case_data') || '{}');
            let value = caseData[key];

            // Format date fields to DD-MM-YYYY
            if (DATE_FIELDS.includes(key) && value) {
                value = formatDateDDMMYYYY(value);
            }

            const displayValue = (value === null || value === '' || value === undefined)
                ? `[${variableMap[key] || key}]`
                : value;

            // Store original rendered value in data-original-value so updateVariable
            // knows exactly what text to target for occurrence-based replacement
            return `<span class="variable" contenteditable="true" onblur="updateVariable('${key}', this.innerText, this)" data-key="${key}" data-original-value="${displayValue.replace(/"/g, '&quot;')}">${displayValue}</span>`;
        }

        //     // DO NOT re-render - keep the edited value as-is
        // }
// Update variable in localStorage and notify parent
        function updateVariable(key, newValue, spanElement) {
            const oldValue = spanElement ? (spanElement.dataset.originalValue || spanElement.dataset.key) : key;

            // Compute which occurrence this specific span is among ALL spans with same key
            let occurrenceIndex = 0;
            if (spanElement) {
                const allSpans = document.querySelectorAll(`#documentPreview span.variable[data-key="${key}"]`);
                for (let i = 0; i < allSpans.length; i++) {
                    if (allSpans[i] === spanElement) {
                        occurrenceIndex = i;
                        break;
                    }
                }
            }

            // Get the original rendered value of this span (before editing)
            const originalText = spanElement ? spanElement.dataset.originalValue : null;

            if (originalText && newValue !== originalText) {
                // Store as occurrence-based text edit (same as select→Edit flow)
                const caseEdits = getCaseEditsForSection();
                const existingIdx = caseEdits.findIndex(
                    e => e.originalText === originalText && e.occurrenceIndex === occurrenceIndex
                );
                if (existingIdx >= 0) {
                    caseEdits[existingIdx].newText = newValue;
                } else {
                    caseEdits.push({ originalText, newText: newValue, occurrenceIndex });
                }
                setCaseEditsForSection(caseEdits);

                // Add to history
                editHistoryManager.addEdit(originalText, newValue, occurrenceIndex);

                // Notify parent with textEdit (occurrence-based)
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'textEdit',
                        originalText: originalText,
                        newText: newValue,
                        occurrenceIndex: occurrenceIndex
                    }, '*');
                }
            } else {
                // No originalValue stored — fall back to global field update
                const caseData = JSON.parse(localStorage.getItem('case_data') || '{}');
                caseData[key] = newValue;
                localStorage.setItem('case_data', JSON.stringify(caseData));

                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'updateField', key: key, value: newValue }, '*');
                }
            }
        }

        });

        // Keyboard shortcuts for undo/redo
        document.addEventListener('keydown', function (e) {
            // Only trigger if modal is not open
            if (editModalOverlay.classList.contains('show')) {
                return;
            }

            // Ctrl+Z or Cmd+Z for undo
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                editHistoryManager.undo();
            }

            // Ctrl+Y or Cmd+Y for redo
            if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) {
                e.preventDefault();
                editHistoryManager.redo();
            }
        });

        // Selection & Edit Functionality
        const floatingEditBtn = document.createElement('button');
        floatingEditBtn.className = 'floating-edit-btn';
        floatingEditBtn.textContent = '✎ Edit';
        document.body.appendChild(floatingEditBtn);

        const editModalOverlay = document.createElement('div');
        editModalOverlay.className = 'edit-modal-overlay';
        editModalOverlay.innerHTML = `
            <div class="edit-modal">
                <h3>Edit Text</h3>
                <textarea id="editModalTextarea" placeholder="Enter new text..."></textarea>
                <div class="edit-modal-buttons">
                    <button class="edit-modal-btn cancel" id="editModalCancel">Cancel</button>
                    <button class="edit-modal-btn save" id="editModalSave">Save</button>
                </div>
            </div>
        `;
        document.body.appendChild(editModalOverlay);

        let currentSelection = null;
        let currentOccurrenceIndex = 0;

        function getCurrentSectionKey() {
            const caseDataRaw = JSON.parse(localStorage.getItem('case_data_raw') || '{}');
            return caseDataRaw.offence_section || 'GENERAL';
        }

       function getCaseEditsForSection() {
            const sectionKey = getCurrentSectionKey();
            const bySection = JSON.parse(localStorage.getItem('case_edits_by_section') || '{}');
            if (bySection && Object.prototype.hasOwnProperty.call(bySection, sectionKey)) {
                const raw = bySection[sectionKey];
                // Always return as array
                if (Array.isArray(raw)) return raw;
                if (raw && typeof raw === 'object') {
                    // Legacy object format → convert to array with occurrenceIndex 0
                    return Object.entries(raw).map(([originalText, newText]) => ({
                        originalText, newText: String(newText ?? ''), occurrenceIndex: 0
                    }));
                }
                return [];
            }
            return [];
        }

        function setCaseEditsForSection(edits) {
            const sectionKey = getCurrentSectionKey();
            const bySection = JSON.parse(localStorage.getItem('case_edits_by_section') || '{}');
            bySection[sectionKey] = edits; // edits is now always an array
            localStorage.setItem('case_edits_by_section', JSON.stringify(bySection));
        }

        function getEditHistoryKey(baseKey) {
            return `${baseKey}_${getCurrentSectionKey()}`;
        }

        // Edit History Manager
        const editHistoryManager = {
            history: [],
            index: -1,
            maxSize: 50,

           addEdit(originalText, newText, occurrenceIndex = 0) {
                // Remove any redo history if user makes new edit after undo
                this.history = this.history.slice(0, this.index + 1);

                // Add new edit
                this.history.push({
                    originalText: originalText,
                    newText: newText,
                    occurrenceIndex: occurrenceIndex,
                    timestamp: Date.now()
                });

                // Limit history size
                if (this.history.length > this.maxSize) {
                    this.history.shift();
                } else {
                    this.index++;
                }

                // Save to localStorage
                localStorage.setItem(getEditHistoryKey('editHistory'), JSON.stringify(this.history));
                localStorage.setItem(getEditHistoryKey('editHistoryIndex'), JSON.stringify(this.index));

                this.updateUI();
            },

            undo() {
                if (this.index > 0) {
                    this.index--;
                    this.applyState();
                }
            },

            redo() {
                if (this.index < this.history.length - 1) {
                    this.index++;
                    this.applyState();
                }
            },

            applyState() {
                if (this.history.length === 0) return;

                // Get edit at current index
                const edit = this.history[this.index];

                // Reverse the replacement (undo) or apply it (redo)
                // We need to figure out which direction we're going
                // Rebuild the document by replaying edits
                this.rebuildDocument();

                // Save to localStorage
                localStorage.setItem(getEditHistoryKey('editHistoryIndex'), JSON.stringify(this.index));
                this.updateUI();
            },

            rebuildDocument() {
                const preview = document.getElementById('documentPreview');
                if (!preview) return;

                // Rebuild as array, keeping last edit per (originalText + occurrenceIndex) pair
                const editsToApply = [];
                const seen = new Map();
                for (let i = 0; i <= this.index; i++) {
                    const edit = this.history[i];
                    const key = `${edit.originalText}__${edit.occurrenceIndex ?? 0}`;
                    seen.set(key, {
                        originalText: edit.originalText,
                        newText: edit.newText,
                        occurrenceIndex: edit.occurrenceIndex ?? 0
                    });
                }
                seen.forEach(v => editsToApply.push(v));

                // Update localStorage
                setCaseEditsForSection(editsToApply);

                // Re-render document to apply all edits from scratch
                renderDocument();

                // Notify parent
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'undoRedo',
                        action: this.index < this.history.length - 1 ? 'undo' : 'redo'
                    }, '*');
                }
            },

            updateUI() {
                const undoBtn = document.getElementById('undoBtn');
                const redoBtn = document.getElementById('redoBtn');

                if (undoBtn) {
                    if (this.index > 0) {
                        undoBtn.classList.remove('btn-disabled');
                        undoBtn.disabled = false;
                    } else {
                        undoBtn.classList.add('btn-disabled');
                        undoBtn.disabled = true;
                    }
                }

                if (redoBtn) {
                    if (this.index < this.history.length - 1) {
                        redoBtn.classList.remove('btn-disabled');
                        redoBtn.disabled = false;
                    } else {
                        redoBtn.classList.add('btn-disabled');
                        redoBtn.disabled = true;
                    }
                }
            },

            loadFromStorage() {
                const storedHistory = localStorage.getItem(getEditHistoryKey('editHistory'));
                const storedIndex = localStorage.getItem(getEditHistoryKey('editHistoryIndex'));

                if (storedHistory) {
                    this.history = JSON.parse(storedHistory);
                }
                if (storedIndex) {
                    this.index = JSON.parse(storedIndex);
                }

                this.updateUI();
            },

            clear() {
                this.history = [];
                this.index = -1;
                localStorage.removeItem(getEditHistoryKey('editHistory'));
                localStorage.removeItem(getEditHistoryKey('editHistoryIndex'));
                this.updateUI();
            }
        };

       // Compute which occurrence (0-indexed) the user selected inside #documentPreview
        function computeOccurrenceIndex(selection, selectedText) {
            const preview = document.getElementById('documentPreview');
            if (!preview || !selectedText) return 0;
            const range = selection.getRangeAt(0);
            const selNode = range.startContainer;
            const selOffset = range.startOffset;

            const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT, null, false);
            let count = 0;
            let node;
            while ((node = walker.nextNode())) {
                const txt = node.nodeValue || '';
                let idx = 0;
                while ((idx = txt.indexOf(selectedText, idx)) !== -1) {
                    if (node === selNode) {
                        if (idx < selOffset) {
                            count++;
                        } else if (idx === selOffset) {
                            return count; // this is the exact occurrence selected
                        }
                    } else {
                        const cmp = node.compareDocumentPosition(selNode);
                        if (cmp & Node.DOCUMENT_POSITION_FOLLOWING) {
                            count++; // this node comes before the selected node
                        }
                    }
                    idx += selectedText.length;
                }
            }
            return count;
        }

        document.addEventListener('mouseup', function () {
            const selection = window.getSelection();
            const selectedText = selection.toString().trim();

            if (selectedText.length > 0) {
                currentSelection = selectedText;
                currentOccurrenceIndex = computeOccurrenceIndex(selection, selectedText); // TRACK POSITION
                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();

                floatingEditBtn.style.display = 'block';

                // Clamp button position to viewport bounds
                const maxX = window.innerWidth - 100;
                const maxY = window.innerHeight - 50;

                floatingEditBtn.style.left = Math.min(Math.max(0, rect.left), maxX) + 'px';
                floatingEditBtn.style.top = Math.min(Math.max(0, rect.bottom + 5), maxY) + 'px';
            } else {
                floatingEditBtn.style.display = 'none';
            }
        });

        floatingEditBtn.addEventListener('click', function () {
            if (currentSelection) {
                document.getElementById('editModalTextarea').value = currentSelection;
                editModalOverlay.classList.add('show');
                document.getElementById('editModalTextarea').focus();
                document.getElementById('editModalTextarea').select();
            }
        });

        document.getElementById('editModalCancel').addEventListener('click', function () {
            editModalOverlay.classList.remove('show');
            currentSelection = null;
            floatingEditBtn.style.display = 'none';
        });

        document.getElementById('editModalSave').addEventListener('click', function () {
            const newText = document.getElementById('editModalTextarea').value.trim();
            if (newText.length === 0 || newText === currentSelection) {
                editModalOverlay.classList.remove('show');
                currentSelection = null;
                floatingEditBtn.style.display = 'none';
                return;
            }

            // Store edit as array entry with occurrenceIndex
            const caseEdits = getCaseEditsForSection(); // returns array
            const existingIdx = caseEdits.findIndex(
                e => e.originalText === currentSelection && e.occurrenceIndex === currentOccurrenceIndex
            );
            if (existingIdx >= 0) {
                caseEdits[existingIdx].newText = newText;
            } else {
                caseEdits.push({ originalText: currentSelection, newText, occurrenceIndex: currentOccurrenceIndex });
            }
            setCaseEditsForSection(caseEdits);

            // Add to history
            editHistoryManager.addEdit(currentSelection, newText, currentOccurrenceIndex);

            // Apply replacement to preview (only the specific occurrence)
            applyTextReplacementToPreview(currentSelection, newText, currentOccurrenceIndex);

            // Notify parent window
            if (window.parent !== window) {
                window.parent.postMessage({
                    type: 'textEdit',
                    originalText: currentSelection,
                    newText: newText,
                    occurrenceIndex: currentOccurrenceIndex
                }, '*');
            }

            editModalOverlay.classList.remove('show');
            currentSelection = null;
            floatingEditBtn.style.display = 'none';
        });

        // Close modal on overlay click
        editModalOverlay.addEventListener('click', function (e) {
            if (e.target === editModalOverlay) {
                editModalOverlay.classList.remove('show');
                currentSelection = null;
                floatingEditBtn.style.display = 'none';
            }
        });

      function applyTextReplacementToPreview(oldText, newText, targetOccurrence = 0) {
            const preview = document.getElementById('documentPreview');
            if (!preview || !oldText) return;

            const normalizedTarget = oldText.replace(/\s+/g, ' ').trim();
            if (!normalizedTarget) return;

            const blocks = preview.querySelectorAll('p, div, td, th');
            let globalMatchCount = 0; // counts occurrences across all blocks
            let isReplaced = false;

            function buildVirtualMap(block) {
                const walker = document.createTreeWalker(
                    block,
                    NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT,
                    {
                        acceptNode(node) {
                            if (node.nodeType === Node.TEXT_NODE) return NodeFilter.FILTER_ACCEPT;
                            if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR') {
                                return NodeFilter.FILTER_ACCEPT;
                            }
                            return NodeFilter.FILTER_SKIP;
                        }
                    },
                    false
                );

                const textNodes = [];
                const coordMap = [];
                let virtualText = '';
                let lastWasSpace = false;
                let node;

                while (node = walker.nextNode()) {
                    if (node.nodeType === Node.TEXT_NODE) {
                        const nodeValue = node.nodeValue || '';
                        if (nodeValue.length === 0) continue;
                        textNodes.push(node);
                        for (let i = 0; i < nodeValue.length; i++) {
                            const ch = nodeValue[i];
                            const isSpace = /\s/.test(ch);
                            if (isSpace) {
                                if (lastWasSpace) continue;
                                virtualText += ' ';
                                coordMap.push({ node, offset: i });
                                lastWasSpace = true;
                                continue;
                            }
                            virtualText += ch;
                            coordMap.push({ node, offset: i });
                            lastWasSpace = false;
                        }
                    } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR') {
                        if (lastWasSpace) continue;
                        virtualText += ' ';
                        coordMap.push({ node: null, offset: null });
                        lastWasSpace = true;
                    }
                }

                return { textNodes, coordMap, virtualText };
            }

            function resolveCoord(coordMap, index, direction) {
                let i = index;
                while (i >= 0 && i < coordMap.length) {
                    if (coordMap[i] && coordMap[i].node) return coordMap[i];
                    i += direction;
                }
                return null;
            }

            for (const block of blocks) {
                if (isReplaced) break;

                const { textNodes, coordMap, virtualText } = buildVirtualMap(block);
                if (!virtualText) continue;

                const normalizedText = virtualText.replace(/\s+/g, ' ').trim();
                if (!normalizedText) continue;

                // Count ALL occurrences in this block to know if target is here
                let searchFrom = 0;
                while (true) {
                    const startIndex = normalizedText.indexOf(normalizedTarget, searchFrom);
                    if (startIndex === -1) break;

                    if (globalMatchCount === targetOccurrence) {
                        // This is the target occurrence — do the replacement
                        const endIndex = startIndex + normalizedTarget.length - 1;
                        const startCoord = resolveCoord(coordMap, startIndex, 1);
                        const endCoord = resolveCoord(coordMap, endIndex, -1);
                        if (!startCoord || !endCoord) break;

                        const startNode = startCoord.node;
                        const endNode = endCoord.node;
                        const startOffset = startCoord.offset;
                        const endOffset = endCoord.offset;

                        if (startNode === endNode) {
                            const original = startNode.nodeValue || '';
                            const before = original.slice(0, startOffset);
                            const after = original.slice(endOffset + 1);
                            startNode.nodeValue = `${before}${newText}${after}`;
                        } else {
                            const startOriginal = startNode.nodeValue || '';
                            const endOriginal = endNode.nodeValue || '';
                            const before = startOriginal.slice(0, startOffset);
                            const after = endOriginal.slice(endOffset + 1);
                            startNode.nodeValue = `${before}${newText}`;

                            const startIndexNode = textNodes.indexOf(startNode);
                            const endIndexNode = textNodes.indexOf(endNode);
                            if (startIndexNode !== -1 && endIndexNode !== -1) {
                                for (let i = startIndexNode + 1; i < endIndexNode; i++) {
                                    textNodes[i].nodeValue = '';
                                }
                            }
                            endNode.nodeValue = after;
                        }

                        isReplaced = true;
                        break;
                    }

                    globalMatchCount++;
                    searchFrom = startIndex + normalizedTarget.length;
                }
            }
        }
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function () {
            initializeSampleData();
            renderDocument();

            // Load edit history from localStorage
            editHistoryManager.loadFromStorage();

            // Listen for storage changes ONLY from other tabs/windows
            // Do NOT re-render for changes made in this same window
            window.addEventListener('storage', function (e) {
                if (e.key === 'case_data' && e.storageArea === localStorage) {
                    // Only re-render if change came from external source (another tab)
                    renderDocument();
                }
            });
        });

        // Apply text edits from localStorage to preview on render
     // Apply text edits from localStorage to preview on render
        function applyStoredTextEdits() {
            const caseEdits = getCaseEditsForSection(); // now an array
            // Sort descending by occurrenceIndex so later occurrences are replaced first,
            // preventing earlier replacements from shifting positions of later ones
            const sorted = [...caseEdits].sort((a, b) => (b.occurrenceIndex ?? 0) - (a.occurrenceIndex ?? 0));
            sorted.forEach(({ originalText, newText, occurrenceIndex }) => {
                applyTextReplacementToPreview(originalText, newText, occurrenceIndex ?? 0);
            });
        }

        // Store original renderDocument and wrap it
        const originalRenderDocument = renderDocument;
        renderDocument = function () {
            originalRenderDocument.call(this);
            applyStoredTextEdits();
        }
    </script>
